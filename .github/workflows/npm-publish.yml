name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact immutable release tag or current main commit SHA"
        required: true
        type: string
      version:
        description: "Package version when ref is the exact current main commit SHA"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTLAS_CORE_COMMIT: 19b75025e5e252e90d93015a839c55d08fcb8061
      HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/Agentlas-OS
      HEPHAESTUS_PYTHON: python
    steps:
      - name: Resolve immutable release tag
        id: release
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_kind=tag
            release_version="${REQUESTED_REF#v}"
          elif [[ "$EVENT_NAME" = workflow_dispatch && "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$REQUESTED_REF" != "$WORKFLOW_SHA" ]; then
              echo "Commit publication requires the exact workflow main SHA: $WORKFLOW_SHA" >&2
              exit 1
            fi
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Commit publication requires an exact X.Y.Z version" >&2
              exit 1
            fi
            release_kind=commit
            release_version="$REQUESTED_VERSION"
          else
            echo "Expected an exact vX.Y.Z tag or the exact current main commit SHA, got: $REQUESTED_REF" >&2
            exit 1
          fi
          {
            echo "ref=$REQUESTED_REF"
            echo "kind=$release_kind"
            echo "version=$release_version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: agentlas-ai/Agentlas-OS
          ref: ${{ env.AGENTLAS_CORE_COMMIT }}
          path: Agentlas-OS
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pin npm trusted-publishing client
        run: |
          npm install --global npm@11.7.0
          test "$(npm --version)" = "11.7.0"

      - name: Verify tag and package identity
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_KIND" = tag ]; then
            test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_REF"
          else
            test "$(git rev-parse HEAD)" = "$RELEASE_REF"
            test "$RELEASE_REF" = "$WORKFLOW_SHA"
          fi
          test "$(node -p "require('./package.json').name")" = "agentlas"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./package.json').repository.url")" = "git+https://github.com/agentlas-ai/agentlas-terminal.git"
          test "$(git -C "$HEPHAESTUS_RUNTIME_ROOT" rev-parse HEAD)" = "$AGENTLAS_CORE_COMMIT"

      - name: Install dependencies
        run: npm ci

      - name: Verify release contracts
        run: npm run test:release-contracts

      - name: Run smoke suite
        run: npm run smoke

      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node - "$RUNNER_TEMP/npm-pack.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0];
          const forbidden = /^(test|tests|benchmarks?|docs?|fixtures|scripts|output|artifacts|evidence|\.env)(\/|$)/i;
          const hits = manifest.files.map((entry) => entry.path).filter((path) => forbidden.test(path));
          if (hits.length) {
            console.error('npm artifact contains development-only paths:\n' + hits.join('\n'));
            process.exit(1);
          }
          console.log(`npm artifact allowlist passed (${manifest.files.length} files)`);
          NODE

      - name: Check registry state
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "agentlas@$RELEASE_VERSION" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --access public

      - name: Verify registry publication
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            published="$(npm view "agentlas@$RELEASE_VERSION" version --json 2>/dev/null | tr -d '"' || true)"
            if [ "$published" = "$RELEASE_VERSION" ]; then
              npm view "agentlas@$RELEASE_VERSION" dist.tarball dist.integrity --json
              exit 0
            fi
            sleep 5
          done
          echo "agentlas@$RELEASE_VERSION did not become visible in the registry" >&2
          exit 1
