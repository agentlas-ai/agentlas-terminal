name: Cross-platform Core harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/agentlas-core-harness.cjs"
      - "package.json"
      - ".github/workflows/cross-platform-harness.yml"
  push:
    branches: [main]
    paths:
      - "engine/agentlas-core-harness.cjs"
      - "package.json"
      - ".github/workflows/cross-platform-harness.yml"

concurrency:
  group: terminal-core-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  terminal-harness:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: agentlas-terminal
      - uses: actions/checkout@v4
        with:
          repository: agentlas-ai/Agentlas-OS
          ref: 9b0248beb6f8728e58421b14f0c9b749bc24b66d
          path: Agentlas-OS
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentlas-terminal/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Terminal dependencies
        working-directory: agentlas-terminal
        run: npm ci
      - name: Verify public Terminal adapter against exact Agentlas OS
        working-directory: agentlas-terminal
        shell: bash
        env:
          HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/Agentlas-OS
          HEPHAESTUS_PYTHON: python
          AGENTLAS_HARNESS_PROOF_PATH: ${{ runner.temp }}/terminal-harness-proof.json
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const {
            CONTEXT_MAP_MIN_CORE_VERSION,
            loadCoreStormbreakerHarness,
            readCoreRuntimeVersion,
          } = require("./engine/agentlas-core-harness.cjs");

          (async () => {
            const root = process.env.HEPHAESTUS_RUNTIME_ROOT;
            const version = readCoreRuntimeVersion(root);
            if (version !== "1.1.88") {
              throw new Error(`Expected Agentlas OS 1.1.88, received ${version || "unknown"}`);
            }
            if (CONTEXT_MAP_MIN_CORE_VERSION !== "1.1.86") {
              throw new Error(`Unexpected Context Map minimum ${CONTEXT_MAP_MIN_CORE_VERSION}`);
            }
            const harness = await loadCoreStormbreakerHarness(process.cwd(), root);
            const proof = {
              schemaVersion: "agentlas.terminal-public-adapter-proof.v1",
              runtimeVersion: version,
              harnessId: harness.harness_id,
              harnessMode: harness.mode,
              promptSha256: harness.prompt_sha256,
            };
            fs.writeFileSync(process.env.AGENTLAS_HARNESS_PROOF_PATH, `${JSON.stringify(proof, null, 2)}\n`);
            process.stdout.write(`${JSON.stringify(proof)}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-harness-proof-${{ runner.os }}
          path: ${{ runner.temp }}/terminal-harness-proof.json
          if-no-files-found: error

  compare-terminal-proofs:
    name: Compare Terminal prompt bytes
    needs: terminal-harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-harness-proof-*
          path: proofs
      - name: Compare public adapter proof across operating systems
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const files = [];
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              if (fs.statSync(full).isDirectory()) walk(full);
              else if (name === "terminal-harness-proof.json") files.push(full);
            }
          }
          walk("proofs");
          if (files.length !== 3) throw new Error(`Expected three platform proofs, received ${files.length}`);
          const proofs = files.map((file) => JSON.parse(fs.readFileSync(file, "utf8")));
          const identities = new Set(proofs.map((proof) => JSON.stringify({
            runtimeVersion: proof.runtimeVersion,
            harnessId: proof.harnessId,
            harnessMode: proof.harnessMode,
            promptSha256: proof.promptSha256,
          })));
          if (identities.size !== 1) throw new Error("Terminal adapter proof differs by operating system");
          console.log(`Cross-platform adapter proof matched: ${proofs[0].promptSha256}`);
          NODE
